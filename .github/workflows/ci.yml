name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aprovo
          POSTGRES_PASSWORD: aprovo
          POSTGRES_DB: aprovo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aprovo -d aprovo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://aprovo:aprovo@localhost:5432/aprovo_test
      DATABASE_URL: postgres://aprovo:aprovo@localhost:5432/aprovo_test
      AUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager"; setting it here too makes the action fail.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
