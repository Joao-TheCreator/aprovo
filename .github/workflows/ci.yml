name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aprovo
          POSTGRES_PASSWORD: aprovo
          POSTGRES_DB: aprovo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aprovo -d aprovo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://aprovo:aprovo@localhost:5432/aprovo_test
      DATABASE_URL: postgres://aprovo:aprovo@localhost:5432/aprovo_test
      AUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager"; setting it here too makes the action fail.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aprovo
          POSTGRES_PASSWORD: aprovo
          POSTGRES_DB: aprovo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aprovo -d aprovo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://aprovo:aprovo@localhost:5432/aprovo_test
      AUTH_SECRET: e2e-auth-secret-not-for-production
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
      IG_PUBLISHER: fake
      IG_PUBLISH_ENABLED: "true"
      CRON_SECRET: e2e-secret
      META_APP_ID: e2e-dummy-app-id
      META_APP_SECRET: e2e-dummy-app-secret
      # RESEND_API_KEY is intentionally unset: e-mails are skipped, nothing reaches Resend or Meta.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
